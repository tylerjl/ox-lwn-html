name: Test Suite

on:
  workflow_dispatch:

  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.org'
      - LICENSE
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.org'
      - LICENSE

env:
  EMACS_TEST_JUNIT_REPORT: 1

jobs:
  test:
    name: Run ert tests in a devshell with emacs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - run: nix develop . --command just test
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: success() || failure()
      with:
        report_paths: 'tests/*.xml'
    - name: Check SimpleCov coverage
      uses: alexremn/simplecov-github-action@v1
      with:
        coverage_path: '.resultset.json'
        post_comment: false
